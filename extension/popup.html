<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Wget Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="top">
    <img src="icons/icon32.png" alt="" width="22" height="22">
    <div class="brand"><strong>Web Wget Pro</strong> <span id="version" class="muted"></span></div>
    <span class="server-pill" id="serverPill" title="État du serveur"><span class="dot"></span><span id="serverText">Serveur…</span></span>
    <button class="icon-btn" id="openDashboard" title="Ouvrir le tableau de bord" aria-label="Tableau de bord" data-icon="grid"></button>
    <button class="icon-btn" id="openOptions" title="Options" aria-label="Options" data-icon="gear"></button>
  </header>

  <section class="page">
    <img id="favicon" alt="" width="16" height="16">
    <div class="page-text">
      <div id="pageTitle" class="ellipsis"></div>
      <div id="pageHost" class="muted ellipsis"></div>
    </div>
    <button class="icon-btn" id="rescan" title="Rescanner la page" aria-label="Rescanner" data-icon="refresh"></button>
  </section>

  <div id="banners"></div>

  <section class="block">
    <div class="block-head">
      <span id="listTitle">Médias détectés</span>
      <button class="link-btn" id="sendAll" hidden></button>
    </div>
    <div id="list" class="list">
      <div class="empty">Analyse de la page…</div>
    </div>
  </section>

  <section class="form">
    <input id="url" type="url" placeholder="Lien à télécharger (choisi automatiquement)" spellcheck="false" autocomplete="off">
    <div class="row">
      <input id="filename" type="text" placeholder="Nom du fichier (optionnel)" spellcheck="false" autocomplete="off">
      <select id="quality" title="Qualité" aria-label="Qualité">
        <option value="best">Meilleure</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="audio">Audio MP3</option>
      </select>
    </div>
    <div class="row">
      <button id="send" class="primary"><span data-icon="up"></span> Envoyer au serveur</button>
      <button id="local" class="secondary" title="Télécharger directement avec le navigateur (fichiers simples)"><span data-icon="down"></span> Sur ce PC</button>
    </div>
  </section>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section class="block" id="jobsBlock" hidden>
    <div class="block-head"><span>Sur le serveur</span></div>
    <div id="jobs" class="jobs"></div>
  </section>

  <script type="module" src="popup.js"></script>
</body>

</html>
